name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Read-only. This job runs every dev dependency (npm ci, build, tests), so its
# token must not be able to push code or cut releases if one is compromised.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Verify manifest + React wrappers are up to date
        run: |
          npm run analyze
          npm run gen:react
          git diff --exit-code custom-elements.json src/react/index.ts
      - name: Build
        run: npm run build && npm run build:lib
      - name: Verify dist/ is a publishable library build
        run: npm run check:dist
      - name: Bundle smoke test
        run: npm run check:bundle
      - name: Install Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      - name: Test
        run: npm test
