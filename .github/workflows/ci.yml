name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Verify manifest + React wrappers are up to date
        run: |
          npm run analyze
          npm run gen:react
          git diff --exit-code custom-elements.json src/react/index.ts
      - name: Build
        run: npm run build && npm run build:lib
      - name: Verify dist/ is a publishable library build
        run: npm run check:dist
      - name: Bundle smoke test
        run: npm run check:bundle
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Test
        run: npm test
