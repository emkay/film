on:
  push:
    branches:
      - main
name: release-please
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v3
        with:
          release-type: node
          package-name: release-please-action
          # Bumps the `x-release-please-version` line so the version Film
          # reports at runtime matches the published package.
          extra-files: src/internal/version.ts
